<body class="dark-header" data-page="contatti">
  <main>
    <section class="contact-hero">
      <div class="contact-layout">
        <aside class="contact-details reveal" aria-label="Información de la empresa">
          <p class="contact-kicker">CONTACTO</p>
          <h1 class="display">Hablemos de tu<br><em>proyecto.</em></h1>
          <p class="lead">Cuéntanos el espacio, la necesidad o la colaboración que quieres desarrollar. Te responderemos con una propuesta concreta.</p>

          <div class="contact-divider" aria-hidden="true"></div>

          <div class="contact-identity" aria-label="Datos de la empresa">
            <div class="contact-info-row">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
              <p><strong>ICONIC S.R.L. a socio unico</strong><br>Via Guido Rossa, 39<br>35020 Ponte San Nicolò (PD) - Italia</p>
            </div>
            <div class="contact-info-row">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4Z"/><path d="m22 6-10 7L2 6"/></svg>
              <a href="mailto:info@iconicoriginal.it">info@iconicoriginal.it</a>
            </div>
          </div>
        </aside>

        <section class="contact-form-panel reveal" aria-labelledby="contact-form-title">
          <form class="contact-form" novalidate>
            <h2 id="contact-form-title" class="sr-only">Formulario de contacto</h2>

            <div class="field full">
              <label for="full_name">Nombre y apellidos *</label>
              <input id="full_name" name="full_name" autocomplete="name" placeholder="Introduce tu nombre" required>
              <span class="field-error" data-error-for="full_name"></span>
            </div>

            <div class="field full">
              <label for="email">Email *</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="Introduce tu correo electrónico" required>
              <span class="field-error" data-error-for="email"></span>
            </div>

            <div class="field full">
              <label for="profilo">Quién eres</label>
              <select id="profilo" name="profilo">
                <option value="">Selecciona una opción</option>
                <option value="Privato">Particular</option>
                <option value="Progettista / Studio tecnico">Proyectista / Estudio técnico</option>
                <option value="Rivenditore / Contract">Distribuidor / Contract</option>
              </select>
            </div>

            <div class="field full">
              <label for="company">Empresa / Estudio <span class="field-optional">(opcional)</span></label>
              <input id="company" name="company" autocomplete="organization" placeholder="Nombre de la empresa o estudio">
            </div>

            <div class="field full">
              <label for="message">Mensaje *</label>
              <textarea id="message" name="message" placeholder="Escribe aquí tu mensaje" required></textarea>
              <span class="field-error" data-error-for="message"></span>
            </div>

            <div class="field full interest-field">
              <label class="privacy-check" for="wants_samples">
                <input id="wants_samples" name="wants_samples" type="checkbox">
                <span>Me gustaría recibir un muestrario de materiales</span>
              </label>
              <label class="privacy-check" for="wants_docs">
                <input id="wants_docs" name="wants_docs" type="checkbox">
                <span>Me gustaría recibir la documentación técnica</span>
              </label>
            </div>

            <div class="field full privacy-field">
              <label class="privacy-check" for="privacy">
                <input id="privacy" name="privacy" type="checkbox" required>
                <span>He leído la <a href="/es/privacy.html">Política de privacidad</a> y consiento el tratamiento de mis datos para los fines indicados en ella. *</span>
              </label>
              <span class="field-error" data-error-for="privacy"></span>
            </div>

            <div class="field full form-actions">
              <button class="contact-submit" type="submit"><span class="contact-submit-label">ENVIAR SOLICITUD</span><span aria-hidden="true">→</span></button>
              <p class="form-status" role="status" aria-live="polite"></p>
            </div>
          </form>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
