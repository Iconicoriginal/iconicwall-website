<body class="dark-header" data-page="contatti">
  <main>
    <section class="contact-hero">
      <div class="contact-layout">
        <aside class="contact-details reveal" aria-label="Company information">
          <p class="contact-kicker">CONTACT</p>
          <h1 class="display">Let's talk about your<br><em>project.</em></h1>
          <p class="lead">Tell us about the space, the need, or the collaboration you'd like to develop. We'll get back to you with a concrete proposal.</p>

          <div class="contact-divider" aria-hidden="true"></div>

          <div class="contact-identity" aria-label="Company details">
            <div class="contact-info-row">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
              <p><strong>ICONIC S.R.L. a socio unico</strong><br>Via Guido Rossa, 39<br>35020 Ponte San Nicolò (PD) - Italy</p>
            </div>
            <div class="contact-info-row">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4Z"/><path d="m22 6-10 7L2 6"/></svg>
              <a href="mailto:info@iconicoriginal.it">info@iconicoriginal.it</a>
            </div>
          </div>
        </aside>

        <section class="contact-form-panel reveal" aria-labelledby="contact-form-title">
          <form class="contact-form" novalidate>
            <h2 id="contact-form-title" class="sr-only">Contact form</h2>

            <div class="field full">
              <label for="full_name">Full name *</label>
              <input id="full_name" name="full_name" autocomplete="name" placeholder="Enter your name" required>
              <span class="field-error" data-error-for="full_name"></span>
            </div>

            <div class="field full">
              <label for="email">Email *</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter your email" required>
              <span class="field-error" data-error-for="email"></span>
            </div>

            <div class="field full">
              <label for="message">Message *</label>
              <textarea id="message" name="message" placeholder="Write your message here" required></textarea>
              <span class="field-error" data-error-for="message"></span>
            </div>

            <div class="field full privacy-field">
              <label class="privacy-check" for="privacy">
                <input id="privacy" name="privacy" type="checkbox" required>
                <span>I have read the <a href="/en/privacy.html">Privacy Policy</a> and consent to the processing of my data for the purposes stated therein. *</span>
              </label>
              <span class="field-error" data-error-for="privacy"></span>
            </div>

            <div class="field full form-actions">
              <button class="contact-submit" type="submit"><span class="contact-submit-label">SEND REQUEST</span><span aria-hidden="true">→</span></button>
              <p class="form-status" role="status" aria-live="polite"></p>
            </div>
          </form>
        </section>
      </div>
    </section>
  </main>
</body>
